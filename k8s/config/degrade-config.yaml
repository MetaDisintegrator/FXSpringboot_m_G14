apiVersion: v1
kind: ConfigMap
metadata:
  name: degrade-config
  namespace: fxtravel
data:
  HOTEL_SERVICE_MODE: "enabled"   # enabled | readonly | disabled
  TRAIN_SERVICE_MODE: "enabled"
  USER_SERVICE_MODE:  "enabled"

  # 可选：是否关闭“推荐”等非核心功能（你已有此开关）
  HOTEL_DISABLE_RECOMMEND: "false"
  TRAIN_DISABLE_RECOMMEND: "false"
  USER_DISABLE_RECOMMEND:  "false"
