apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: fxtravel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user
          image: user-service:latest   # TODO 改成真实镜像（你原来少了 :latest，这里顺手补上）
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          env:
            - name: SERVICE_MODE
              valueFrom:
                configMapKeyRef:
                  name: degrade-config
                  key: USER_MODE
            - name: DISABLE_RECOMMEND
              valueFrom:
                configMapKeyRef:
                  name: degrade-config
                  key: DISABLE_RECOMMEND
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: fxtravel
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
