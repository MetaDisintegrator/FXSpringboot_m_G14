apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: fxtravel
spec:
  replicas: 0
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway
          image: gateway-service:latest   # TODO 改成真实镜像
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          env:
            - name: GATEWAY_MODE
              valueFrom:
                configMapKeyRef: { name: fxtravel-degrade-config, key: GATEWAY_MODE }
            - name: USER_MODE
              valueFrom:
                configMapKeyRef: { name: fxtravel-degrade-config, key: USER_MODE }
            - name: TRAIN_MODE
              valueFrom:
                configMapKeyRef: { name: fxtravel-degrade-config, key: TRAIN_MODE }
            - name: HOTEL_MODE
              valueFrom:
                configMapKeyRef: { name: fxtravel-degrade-config, key: HOTEL_MODE }
            - name: DISABLE_RECOMMEND
              valueFrom:
                configMapKeyRef: { name: fxtravel-degrade-config, key: DISABLE_RECOMMEND }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: fxtravel
spec:
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
