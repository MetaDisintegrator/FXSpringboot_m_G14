apiVersion: apps/v1
kind: Deployment
metadata:
  name: train-service
  namespace: fxtravel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: train-service
  template:
    metadata:
      labels:
        app: train-service
    spec:
      containers:
        - name: train
          image: train-service:latest   # TODO 改成真实镜像
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          env:
            - name: SERVICE_MODE
              valueFrom:
                configMapKeyRef:
                  name: degrade-config
                  key: TRAIN_MODE
            - name: DISABLE_RECOMMEND
              valueFrom:
                configMapKeyRef:
                  name: degrade-config
                  key: DISABLE_RECOMMEND
---
apiVersion: v1
kind: Service
metadata:
  name: train-service
  namespace: fxtravel
spec:
  selector:
    app: train-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
