server:
  port: 8901

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          # 配置存储配置信息的Git仓库
#          uri: https://github.com/MetaDisintegrator/fx-m-config.git
#          username: MetaDisintegrator
#          password: yyyYYY&0121
          uri: https://gitee.com/sequential-dispersion/fx-m-config.git
          username: sequential-dispersion
          password: yYyY&0121
          # 开启启动时直接从git获取配置
          clone-on-start: true
          default-label: master

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://m-eureka-svc:8761/eureka/
